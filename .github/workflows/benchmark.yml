name: LLM benchmark (cloud)
# Runs an open-source LLM via Ollama on a GitHub-hosted runner, scores its OpenSCAD output
# against ground truth, commits results, and republishes the site with the benchmark page.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model tag
        default: deepseek-coder-v2:16b
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Free disk space for the model
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: npm ci
      - name: Install OpenSCAD and Ollama
        run: |
          sudo apt-get update && sudo apt-get install -y openscad xvfb
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull model
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ inputs.model }}"
          nproc; free -g
      - name: Run benchmark
        env:
          XVFB: "1"
        run: node bench/run.mjs --model "${{ inputs.model }}" --out public/benchmark
      - name: Build drawing gallery
        run: node bench/gallery.mjs public/benchmark
      - name: Build report
        run: node bench/report.mjs public/benchmark >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/benchmark
          git commit -m "Benchmark results for ${{ inputs.model }}" || echo "nothing to commit"
          git pull --rebase origin main && git push origin HEAD:main
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: public/benchmark
  deploy:
    needs: bench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
